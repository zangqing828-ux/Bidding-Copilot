name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo_hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check lockfiles
        run: |
          test -f client/package-lock.json
          test -f analytics/worker/package-lock.json
          test -f analytics/dashboard/package-lock.json

      - name: Check changed-file whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PULL_REQUEST_BASE_SHA"
          else
            BASE_SHA="$PUSH_BASE_SHA"
          fi

          if [ -n "$BASE_SHA" ] \
            && ! printf '%s' "$BASE_SHA" | grep -Eq '^0+$' \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          else
            git show --check --format=fuller "$HEAD_SHA"
          fi

  client:
    name: Client Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 for Node.js
        run: npm rebuild better-sqlite3 --runtime=node

      - name: Check CommonJS syntax
        run: find electron scripts server core shared -name '*.cjs' -print0 | xargs -0 -n1 node --check

      - name: Build renderer
        run: npm run build

      - name: Run complete Web gate
        run: npm run test:web
        env:
          CONFIG_ENCRYPTION_KEY: ci-test-encryption-key

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser Web export gate
        run: npm run test:web-browser

      - name: Run Electron native smoke
        run: xvfb-run -a npm run smoke:electron-native

      - name: Docker build
        working-directory: .
        run: docker build -t bidding-copilot-web:ci .

      - name: Verify checksum rejection and Web image boundary
        working-directory: client
        run: npm run test:opencode-checksum && npm run test:web-image-boundary

      - name: Verify Web production image excludes Runner tools
        working-directory: .
        run: |
          docker run --rm --entrypoint node bidding-copilot-web:ci -e '
            const fs = require("node:fs");
            const forbidden = [
              "/app/client/vendor/opencode",
              "/app/client/vendor/opencode-tools",
              "/usr/bin/curl",
              "/usr/bin/jq",
              "/usr/bin/rg",
              "/usr/bin/fd",
              "/usr/bin/prlimit"
            ];
            if (forbidden.some((entry) => fs.existsSync(entry))) process.exit(1);
          '

      - name: Docker Web business smoke
        working-directory: .
        run: |
          docker run -d --name web-test -p 3000:3000 \
            -e NODE_ENV=test \
            -e OAUTH_MODE=mock \
            -e WEB_BID_ANALYSIS_TEST_MODE=1 \
            -e SESSION_SECRET=ci-test-secret \
            -e CONFIG_ENCRYPTION_KEY=ci-test-key \
            -e YIBIAO_DATA_DIR=/data \
            bidding-copilot-web:ci
          # 等待服务启动，最多 30 秒
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "Health check passed after ${i}s"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Health check failed after 30s"
              docker logs web-test
              docker stop web-test || true
              docker rm web-test || true
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:3000/api/readiness
          curl -sS -D /tmp/yibiao-mock-login-headers -c /tmp/yibiao-mock-cookies \
            -o /dev/null http://127.0.0.1:3000/api/auth/login
          oauth_state="$(grep -i '^location:' /tmp/yibiao-mock-login-headers \
            | sed -E 's#.*[?&]state=([^&[:space:]]+).*#\1#' \
            | tr -d '\r')"
          test -n "$oauth_state"
          curl -sS -b /tmp/yibiao-mock-cookies -c /tmp/yibiao-mock-cookies \
            -o /dev/null -X POST \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode 'email=ci-worker@example.test' \
            --data-urlencode 'name=CI Worker' \
            --data-urlencode "state=$oauth_state" \
            http://127.0.0.1:3000/api/auth/mock-callback
          curl -fsS -b /tmp/yibiao-mock-cookies \
            -H 'content-type: application/json' \
            -d '{"namespace":"technicalPlan","method":"loadState","args":[]}' \
            http://127.0.0.1:3000/api/bridge | grep -q '"code":"OK"'
          printf '%s\n' 'CI 招标文件：项目概况、技术要求、交付服务要求。' > /tmp/yibiao-bid-analysis.txt
          upload_response="$(curl -fsS -b /tmp/yibiao-mock-cookies \
            -F 'file=@/tmp/yibiao-bid-analysis.txt;type=text/plain' \
            http://127.0.0.1:3000/api/uploads)"
          file_id="$(node -e "const result = JSON.parse(process.argv[1]); if (!/^[0-9a-f-]{36}$/i.test(result.fileId || '')) process.exit(1); process.stdout.write(result.fileId);" "$upload_response")"
          curl -fsS -b /tmp/yibiao-mock-cookies \
            -H 'content-type: application/json' \
            -d "{\"namespace\":\"technicalPlan\",\"method\":\"importTenderDocument\",\"args\":[[\"${file_id}\"]]}" \
            http://127.0.0.1:3000/api/bridge | grep -q '"code":"OK"'
          curl -fsS -b /tmp/yibiao-mock-cookies \
            -H 'content-type: application/json' \
            -d '{"namespace":"tasks","method":"startBidAnalysis","args":[{"mode":"key","selected_task_ids":["projectOverview","techRequirements","projectInfo","partAInfo","deliveryAndServiceRequirements"],"force_rerun":true}]}' \
            http://127.0.0.1:3000/api/bridge | grep -q '"code":"OK"'
          for i in $(seq 1 30); do
            curl -fsS -b /tmp/yibiao-mock-cookies \
              -H 'content-type: application/json' \
              -d '{"namespace":"technicalPlan","method":"loadState","args":[]}' \
              -o /tmp/yibiao-bid-analysis-state.json \
              http://127.0.0.1:3000/api/bridge
            if node -e "const fs = require('node:fs'); const result = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); const state = result.data || {}; process.exit(result.code === 'OK' && state.bidAnalysisTask?.status === 'success' && state.bidAnalysisTasks?.projectOverview?.status === 'success' ? 0 : 1);" /tmp/yibiao-bid-analysis-state.json; then
              echo "Bid analysis business smoke passed after ${i}s"
              break
            fi
            if [ $i -eq 30 ]; then
              echo 'Bid analysis business smoke failed'
              cat /tmp/yibiao-bid-analysis-state.json
              docker logs web-test
              docker stop web-test || true
              docker rm web-test || true
              exit 1
            fi
            sleep 1
          done
          curl -fsS -b /tmp/yibiao-mock-cookies \
            -H 'content-type: application/json' \
            -d '{"namespace":"export","method":"exportWord","args":[{"project_name":"CI 投标技术文件","outline":[{"id":"ci-outline-1","title":"第一章","content":"容器端到端导出验证内容","children":[]}]}]}' \
            -o /tmp/yibiao-export.json \
            http://127.0.0.1:3000/api/bridge
          download_url="$(node -e "const fs = require('node:fs'); const result = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); const url = result.code === 'OK' && result.data?.success === true ? result.data.downloadUrl : ''; if (!/^\\/api\\/downloads\\/[0-9a-f-]+$/i.test(url)) process.exit(1); process.stdout.write(url);" /tmp/yibiao-export.json)"
          curl -fsS -b /tmp/yibiao-mock-cookies \
            -o /tmp/yibiao-export.docx \
            "http://127.0.0.1:3000${download_url}"
          node -e "const fs = require('node:fs'); const file = fs.readFileSync(process.argv[1]); if (file.length < 4 || file[0] !== 0x50 || file[1] !== 0x4b) process.exit(1);" /tmp/yibiao-export.docx
          download_status="$(curl -sS -b /tmp/yibiao-mock-cookies -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000${download_url}")"
          test "$download_status" = "404"
          docker stop web-test
          docker rm web-test

      - name: Docker production OAuth smoke
        working-directory: .
        run: |
          docker run -d --name web-prod-test -p 3001:3000 \
            -e NODE_ENV=production \
            -e OAUTH_MODE=mainquest \
            -e MAINQUEST_AUTH_BASE_URL=https://auth.example.test \
            -e MAINQUEST_OAUTH_CLIENT_ID=ci-client-id \
            -e MAINQUEST_OAUTH_CLIENT_SECRET=ci-client-secret \
            -e MAINQUEST_OAUTH_REDIRECT_URI=https://web.example.test/api/auth/callback \
            -e PUBLIC_BASE_URL=https://web.example.test \
            -e SESSION_SECRET=ci-production-session-secret \
            -e CONFIG_ENCRYPTION_KEY=ci-production-encryption-key \
            -e YIBIAO_DATA_DIR=/data \
            bidding-copilot-web:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/readiness >/dev/null 2>&1; then
              echo "Production readiness passed after ${i}s"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Production readiness failed after 30s"
              docker logs web-prod-test
              docker stop web-prod-test || true
              docker rm web-prod-test || true
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/api/health
          curl -fsS http://127.0.0.1:3001/api/readiness
          curl -sS -D /tmp/yibiao-oauth-headers -o /dev/null http://127.0.0.1:3001/api/auth/login
          grep -Eiq '^location: https://auth\.example\.test/oauth/authorize\\?' /tmp/yibiao-oauth-headers
          grep -Eiq '^set-cookie: yibiao_oauth_state=.*; Secure;' /tmp/yibiao-oauth-headers
          docker stop web-prod-test
          docker rm web-prod-test

      - name: Block critical production vulnerabilities
        run: npm run audit:production

  technical_plan_core:
    name: Technical Plan Core Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 for Node.js
        run: npm rebuild better-sqlite3 --runtime=node

      - name: Run WP-J J-1 Node gate
        run: npm run wp-j:gate:j1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run WP-J J-1 browser gate
        run: npm run test:web-technical-plan-browser

  analytics_worker:
    name: Analytics Worker Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: analytics/worker

    env:
      WRANGLER_SEND_METRICS: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analytics/worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Worker bundle
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/analytics-worker"

      - name: Block critical vulnerabilities
        run: npm audit --audit-level=critical

  technical_plan_content:
    name: Technical Plan Content Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci && npm rebuild better-sqlite3 --runtime=node

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run WP-J J-2 content gate
        run: npm run wp-j:gate:j2

      - name: Upload J-2 Chromium and quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-plan-content-evidence
          path: |
            client/playwright-report
            client/test-results
          if-no-files-found: error

  agent_foundation:
    name: Agent Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci && npm rebuild better-sqlite3 --runtime=node
      - name: Run Agent foundation tests
        working-directory: client
        run: npm run test:web-agent-protocol && npm run test:web-agent-runtime && npm run test:web-agent-coordinator && npm run test:web-agent-executor
      - name: Verify fixed Runner asset manifest
        working-directory: client
        run: npm run test:web-agent-runner-assets
      - name: Build independent Runner target
        run: |
          docker build --target agent-runner -t bidding-copilot-agent:foundation .
          docker build -f docker/agent-runner/Dockerfile -t bidding-copilot-agent:independent .

  agent_sidecar_security:
    name: Agent Sidecar Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci && npm rebuild better-sqlite3 --runtime=node
      - name: Run Sidecar security and Web boundary tests
        working-directory: client
        run: npm run test:web-agent-sidecar-security && npm run test:web-agent-readiness && npm run test:web-agent-runner-assets && npm run wp-j:doctor
      - name: Build Web production image and assert negative boundary
        run: |
          docker build --target production -t bidding-copilot-web:sidecar-security .
          docker run --rm --entrypoint node bidding-copilot-web:sidecar-security -e '
            const fs = require("node:fs");
            const forbidden = [
              "/app/client/vendor/opencode",
              "/app/client/vendor/opencode-tools",
              "/usr/bin/curl",
              "/usr/bin/jq",
              "/usr/bin/rg",
              "/usr/bin/fd",
              "/usr/bin/prlimit"
            ];
            if (forbidden.some((entry) => fs.existsSync(entry))) process.exit(1);
          '

  agent_sidecar_e2e:
    name: Agent Sidecar E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci && npm rebuild better-sqlite3 --runtime=node
      - name: Run protocol and HTTP E2E
        working-directory: client
        run: npm run test:web-agent-sidecar-e2e
      - name: Validate independent Runner image identity and policy
        run: |
          docker build -f docker/agent-runner/Dockerfile -t bidding-copilot-agent:e2e .
          docker run --rm --entrypoint node bidding-copilot-agent:e2e -e '
            const policy = require("/opt/bidmaster/client/agent-runner/securityPolicy.cjs");
            if (process.getuid() !== 10001 || !policy.validateRunnerSecurityPolicy(policy.RUNNER_SECURITY_POLICY)) process.exit(1);
          '
          docker run --rm --entrypoint sh bidding-copilot-agent:e2e -c '
            set -eu;
            /opt/agent-assets/bin/opencode --version >/dev/null;
            /opt/agent-assets/bin/rg --version >/dev/null;
            /opt/agent-assets/bin/fd --version >/dev/null;
            test "$(/opt/agent-assets/bin/jq -n "1+1")" = 2;
            prlimit --version >/dev/null;
          '
      - name: Validate Compose topology
        run: |
          touch .env
          YIBIAO_SIDECAR_SECRET=ci-sidecar-secret docker compose --profile j-agent config --quiet

  analytics_dashboard:
    name: Analytics Dashboard Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: analytics/dashboard

    env:
      WRANGLER_SEND_METRICS: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analytics/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Dashboard bundle
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/analytics-dashboard"

      - name: Block critical vulnerabilities
        run: npm audit --audit-level=critical

  quality_gate:
    name: Quality Gate
    if: ${{ always() }}
    needs:
      - repo_hygiene
      - client
      - technical_plan_core
      - technical_plan_content
      - analytics_worker
      - analytics_dashboard
      - agent_foundation
      - agent_sidecar_security
      - agent_sidecar_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        env:
          REPO_HYGIENE_RESULT: ${{ needs.repo_hygiene.result }}
          CLIENT_RESULT: ${{ needs.client.result }}
          TECHNICAL_PLAN_CORE_RESULT: ${{ needs.technical_plan_core.result }}
          TECHNICAL_PLAN_CONTENT_RESULT: ${{ needs.technical_plan_content.result }}
          ANALYTICS_WORKER_RESULT: ${{ needs.analytics_worker.result }}
          ANALYTICS_DASHBOARD_RESULT: ${{ needs.analytics_dashboard.result }}
          AGENT_FOUNDATION_RESULT: ${{ needs.agent_foundation.result }}
          AGENT_SIDECAR_SECURITY_RESULT: ${{ needs.agent_sidecar_security.result }}
          AGENT_SIDECAR_E2E_RESULT: ${{ needs.agent_sidecar_e2e.result }}
        run: |
          printf '%s\n' \
            "Repository Hygiene: $REPO_HYGIENE_RESULT" \
            "Client Build: $CLIENT_RESULT" \
            "Technical Plan Core Gate: $TECHNICAL_PLAN_CORE_RESULT" \
            "Technical Plan Content Gate: $TECHNICAL_PLAN_CONTENT_RESULT" \
            "Analytics Worker Check: $ANALYTICS_WORKER_RESULT" \
            "Analytics Dashboard Check: $ANALYTICS_DASHBOARD_RESULT" \
            "Agent Foundation: $AGENT_FOUNDATION_RESULT" \
            "Agent Sidecar Security: $AGENT_SIDECAR_SECURITY_RESULT" \
            "Agent Sidecar E2E: $AGENT_SIDECAR_E2E_RESULT"

          test "$REPO_HYGIENE_RESULT" = "success"
          test "$CLIENT_RESULT" = "success"
          test "$TECHNICAL_PLAN_CORE_RESULT" = "success"
          test "$TECHNICAL_PLAN_CONTENT_RESULT" = "success"
          test "$ANALYTICS_WORKER_RESULT" = "success"
          test "$ANALYTICS_DASHBOARD_RESULT" = "success"
          test "$AGENT_FOUNDATION_RESULT" = "success"
          test "$AGENT_SIDECAR_SECURITY_RESULT" = "success"
          test "$AGENT_SIDECAR_E2E_RESULT" = "success"
