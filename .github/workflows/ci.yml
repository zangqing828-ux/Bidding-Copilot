name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repo_hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check lockfiles
        run: |
          test -f client/package-lock.json
          test -f analytics/worker/package-lock.json
          test -f analytics/dashboard/package-lock.json

      - name: Check changed-file whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PULL_REQUEST_BASE_SHA"
          else
            BASE_SHA="$PUSH_BASE_SHA"
          fi

          if [ -n "$BASE_SHA" ] \
            && ! printf '%s' "$BASE_SHA" | grep -Eq '^0+$' \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          else
            git show --check --format=fuller "$HEAD_SHA"
          fi

  client:
    name: Client Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check CommonJS syntax
        run: find electron scripts -name '*.cjs' -print0 | xargs -0 -n1 node --check

      - name: Build renderer
        run: npm run build

      - name: Block critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

  analytics_worker:
    name: Analytics Worker Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: analytics/worker

    env:
      WRANGLER_SEND_METRICS: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analytics/worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Worker bundle
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/analytics-worker"

      - name: Block critical vulnerabilities
        run: npm audit --audit-level=critical

  analytics_dashboard:
    name: Analytics Dashboard Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: analytics/dashboard

    env:
      WRANGLER_SEND_METRICS: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analytics/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Dashboard bundle
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/analytics-dashboard"

      - name: Block critical vulnerabilities
        run: npm audit --audit-level=critical

  quality_gate:
    name: Quality Gate
    if: ${{ always() }}
    needs:
      - repo_hygiene
      - client
      - analytics_worker
      - analytics_dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        env:
          REPO_HYGIENE_RESULT: ${{ needs.repo_hygiene.result }}
          CLIENT_RESULT: ${{ needs.client.result }}
          ANALYTICS_WORKER_RESULT: ${{ needs.analytics_worker.result }}
          ANALYTICS_DASHBOARD_RESULT: ${{ needs.analytics_dashboard.result }}
        run: |
          printf '%s\n' \
            "Repository Hygiene: $REPO_HYGIENE_RESULT" \
            "Client Build: $CLIENT_RESULT" \
            "Analytics Worker Check: $ANALYTICS_WORKER_RESULT" \
            "Analytics Dashboard Check: $ANALYTICS_DASHBOARD_RESULT"

          test "$REPO_HYGIENE_RESULT" = "success"
          test "$CLIENT_RESULT" = "success"
          test "$ANALYTICS_WORKER_RESULT" = "success"
          test "$ANALYTICS_DASHBOARD_RESULT" = "success"
